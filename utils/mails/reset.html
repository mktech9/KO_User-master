<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f7;

            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #ffffff;
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #eaeaec;
        }
        .header img {
            max-width: 200px;
        }
        .content {
            padding: 40px 20px;
            text-align: center;
        }
        .content h1 {
            font-size: 24px;
            margin: 0 0 20px;
        }
        .content p {
            font-size: 16px;
            color: #333333;
            margin: 0 0 30px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .footer {
            padding: 20px;
            text-align: center;
            color: #777777;
            font-size: 12px;
        }

<body>
    <div class="email-container">
        <div class="header">
            <img src="https://via.placeholder.com/150x50?text=BLUASSIST" alt="BLUASSIST">

            <h1>Reset your password</h1>
